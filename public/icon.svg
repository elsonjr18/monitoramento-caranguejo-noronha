      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="100%" stop-color="#feedcd" />
    </radialGradient>
    
    <linearGradient id="crabAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
